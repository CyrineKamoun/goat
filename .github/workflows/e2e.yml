name: "E2E"

# The Playwright suite (apps/web/playwright) against a stack started from
# source: infra from the root compose.yaml, core, geoapi, processes and
# catalog with uvicorn, and a production build of the web app, with auth on:
# Keycloak (the GOAT image, importing the compose bundle's realm) and Mailpit
# to catch email. `scripts/e2e/provision.py` creates the test users per role
# and their organizations through the real API; the Playwright setup logs
# each one in once and the specs pick a role.
#
# Runs on every PR that changes the app, a service or the suite itself, and on
# every push to main (which also catches two PRs that only break together).
# Not a required check yet: until the suite has proven stable, a red run
# informs the PR without blocking it.
#
# Windmill is not started: uploads, tool and workflow runs never complete
# here. The specs that need datasets get them from `core.scripts.seed_e2e`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "playwright.config.ts"
      - "apps/web/**"
      - "apps/core/**"
      - "apps/geoapi/**"
      - "apps/processes/**"
      - "apps/catalog/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # One set of settings for the compose infra (which reads .env) and for
      # every service, all of which read their settings from the environment:
      # .env.example's localhost development values, pointed at services on
      # this runner instead of compose service names. No status or website
      # feeds: the run does not depend on the live website, and a fresh user
      # would otherwise get the first-visit spotlight, a modal over every page.
      - name: ⚙️ Environment
        run: |
          cp .env.example .env
          data_dir="$GITHUB_WORKSPACE/data"
          # Garage keys have their own shape: GK + 24 hex, and 64 hex.
          key_id="GK$(openssl rand -hex 12)"
          key_secret="$(openssl rand -hex 32)"
          cat >> .env <<EOF
          POSTGRES_SERVER=localhost
          DUCKLAKE_POSTGRES_SERVER=localhost
          S3_ENDPOINT_URL=http://localhost:3900
          S3_PUBLIC_ENDPOINT_URL=http://localhost:3900
          ASSETS_S3_ENDPOINT_URL=http://localhost:3900
          ASSETS_URL=http://localhost:3900/goat-assets
          S3_PROVIDER=garage
          S3_REGION=garage
          AWS_REGION=garage
          S3_ACCESS_KEY_ID=$key_id
          S3_SECRET_ACCESS_KEY=$key_secret
          AWS_ACCESS_KEY_ID=$key_id
          AWS_SECRET_ACCESS_KEY=$key_secret
          S3_BUCKET_NAME=goat
          AWS_S3_ASSETS_BUCKET=goat-assets
          GARAGE_RPC_SECRET=$(openssl rand -hex 32)
          GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)
          DATA_DIR=$data_dir
          DUCKLAKE_DATA_DIR=$data_dir/ducklake
          TILES_DATA_DIR=$data_dir/tiles
          GOAT_PROCESSES_URL=http://localhost:8300
          WINDMILL_URL=http://localhost:1
          NEXT_PUBLIC_CATALOG_URL=http://localhost:8400/stac
          NEXT_PUBLIC_STATUS_FEED_URL=
          NEXT_PUBLIC_WEBSITE_URL=
          NEXTAUTH_SECRET=e2e-only-secret
          NEXTAUTH_URL=http://localhost:3000
          AUTH=True
          NEXT_PUBLIC_AUTH=True
          KEYCLOAK_SERVER_URL=http://localhost:8080
          REALM_NAME=goat
          KEYCLOAK_CLIENT_ID=goat
          KEYCLOAK_CLIENT_SECRET=$(openssl rand -hex 16)
          NEXT_PUBLIC_KEYCLOAK_ISSUER=http://localhost:8080/realms/goat
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=goat
          KEYCLOAK_PROVISION_INVITED_USERS=True
          E2E_KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)
          E2E_PASSWORD=E2e-$(openssl rand -hex 12)!
          E2E_AUTH=1
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_SECURITY=none
          SMTP_FROM=goat@e2e.test
          EOF
          mkdir -p "$data_dir"
          # Later lines win, as in a shell `. .env`; GITHUB_ENV takes the
          # last value of a name too.
          grep -E '^[A-Z_][A-Z0-9_]*=' .env | sed 's/"//g' >> "$GITHUB_ENV"

      # S3 is Garage, as in the compose bundle (deploy/compose): MinIO no
      # longer publishes images, so the root compose.yaml's cannot be pulled.
      # Keycloak is the GOAT image with the compose bundle's realm, as a
      # self-hosted install runs it; it shares the compose Postgres, whose
      # init creates the keycloak database. Mailpit catches the mail that
      # core and Keycloak send (invitations, password setup).
      - name: 🐘 Infra (Postgres, Redis, Garage, Keycloak, Mailpit)
        run: |
          docker compose up -d --wait db redis
          docker run -d --name garage -p 3900:3900 -p 3903:3903 \
            -e GARAGE_RPC_SECRET -e GARAGE_ADMIN_TOKEN \
            -v "$PWD/deploy/compose/init/garage/garage.toml:/etc/garage.toml:ro" \
            dxflrs/garage:v2.4.1
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.27
          docker run -d --name keycloak --network host \
            -e KEYCLOAK_DATABASE_VENDOR=postgresql -e KEYCLOAK_DATABASE_HOST=localhost \
            -e KEYCLOAK_DATABASE_PORT=5432 -e KEYCLOAK_DATABASE_NAME=keycloak \
            -e KEYCLOAK_DATABASE_USER="$POSTGRES_USER" -e KEYCLOAK_DATABASE_PASSWORD="$POSTGRES_PASSWORD" \
            -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD="$E2E_KEYCLOAK_ADMIN_PASSWORD" \
            -e KEYCLOAK_EXTRA_ARGS=--import-realm -e KEYCLOAK_PRODUCTION=false \
            -e KEYCLOAK_ENABLE_HEALTH_ENDPOINTS=true -e KC_HOSTNAME_STRICT=false \
            -e GOAT_PUBLIC_URL=http://localhost:3000 -e GOAT_REALM=goat \
            -e GOAT_CLIENT_ID=goat -e GOAT_CLIENT_SECRET="$KEYCLOAK_CLIENT_SECRET" \
            -e GOAT_ADMIN_EMAIL=e2e-realm-admin@goat.test \
            -e GOAT_ADMIN_PASSWORD="$E2E_KEYCLOAK_ADMIN_PASSWORD" -e GOAT_SSL_REQUIRED=none \
            -e GOAT_SMTP_HOST=localhost -e GOAT_SMTP_PORT=1025 -e GOAT_SMTP_FROM=goat@e2e.test \
            -e GOAT_SMTP_FROM_NAME=GOAT -e GOAT_SMTP_AUTH=false -e GOAT_SMTP_USER= \
            -e GOAT_SMTP_PASSWORD= -e GOAT_SMTP_STARTTLS=false -e GOAT_SMTP_SSL=false \
            -v "$PWD/deploy/compose/init/keycloak/realm-goat.json:/opt/bitnami/keycloak/data/import/realm-goat.json:ro" \
            ghcr.io/plan4better/goat/keycloak:latest

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      # As in the test jobs: gdal and the C++ routing package are imported
      # lazily, by code paths the suite does not reach.
      - name: 🐍 Python dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing

      - name: 📥 JS dependencies
        uses: ./.github/actions/pnpm-install

      - name: 🪣 Buckets
        env:
          GARAGE_ADMIN_URL: http://localhost:3903
          GARAGE_S3_URL: http://localhost:3900
          GOAT_PUBLIC_URL: http://localhost:3000
          UPLOADS_BUCKET: goat
          ASSETS_BUCKET: goat-assets
        run: uv run --no-sync python deploy/compose/init/garage/garage-init.py

      - name: 🗄️ Database, seed data, DuckLake catalog
        run: |
          (cd apps/core && uv run --no-sync alembic upgrade head)
          (cd apps/core && uv run --no-sync python -m core.scripts.initial_data)
          uv run --no-sync python -m goatlib.storage.ducklake_init

      # core reads Keycloak's signing key at startup, so the realm must be
      # up before the services start.
      - name: 🔑 Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/realms/goat >/dev/null && { echo "realm ready after $((i * 2))s"; exit 0; }
            sleep 2
          done
          docker logs keycloak | tail -40
          echo "::error::Keycloak realm never came up"; exit 1

      - name: 🚀 Services
        run: |
          mkdir -p logs
          start() { (cd "apps/$1" && nohup uv run --no-sync uvicorn "$1.main:app" --port "$2" > "../../logs/$1.log" 2>&1 &) ; }
          start core 8000
          start geoapi 8100
          start processes 8300
          # catalog serves a parquet mirror this runner does not have; the
          # specs only open its page, so a catalog that fails to start is
          # tolerated (its log is kept for the report).
          start catalog 8400

      - name: 🏗️ Web build
        run: pnpm --filter @p4b/web build

      - name: 🌐 Web server
        run: |
          (cd apps/web && nohup pnpm start --port 3000 > ../../logs/web.log 2>&1 &)
          for url in http://localhost:8000/api/healthz http://localhost:8100/ http://localhost:8300/ http://localhost:3000/; do
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" != "000" ] && break
              sleep 2
            done
            echo "$url -> $code"
            [ "$code" != "000" ] || { echo "::error::$url never answered"; exit 1; }
          done

      - name: 👥 Test users, organizations, datasets
        run: |
          uv run --no-sync python scripts/e2e/provision.py
          owner=$(jq -r .users.owner.id apps/web/playwright/.auth/users.json)
          (cd apps/core && uv run --no-sync python -m core.scripts.seed_e2e --user-id "$owner")

      - name: 🎭 Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: 💾 Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: 📥 Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: 📥 Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: 🧪 Playwright
        run: pnpm exec playwright test --config=playwright.config.ts

      - name: 🗒️ Container logs
        if: failure()
        run: for c in keycloak mailpit garage; do docker logs "$c" > "logs/$c.log" 2>&1 || true; done

      - name: 📤 Report and service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            test-results/
            logs/
          retention-days: 14
