name: "Set up lychee"
description: "The lychee link checker, a pinned release verified by checksum, on PATH"
author: "Plan4Better GmbH"

runs:
  using: "composite"
  steps:
    - name: 🔗 lychee
      shell: bash
      env:
        VERSION: lychee-v0.24.2
      run: |
        case "$(uname -m)" in
          x86_64) arch=x86_64 sha256=1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a ;;
          aarch64) arch=aarch64 sha256=91a7bd65685da41b90ccb9bc867a3d649a7818042dae04ff405e55a25bddee4c ;;
          *) echo "::error::no lychee build for $(uname -m)"; exit 1 ;;
        esac
        archive="$RUNNER_TEMP/lychee.tar.gz"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/lycheeverse/lychee/releases/download/$VERSION/lychee-$arch-unknown-linux-gnu.tar.gz"
        echo "$sha256  $archive" | sha256sum -c --quiet -
        mkdir -p "$RUNNER_TEMP/lychee"
        tar -xzf "$archive" -C "$RUNNER_TEMP/lychee" --strip-components=1
        echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
