# lychee settings for the docs link checks: .github/workflows/docs-links.yml
# (every external link, weekly) and scripts/check-docs-links.sh (the links a
# pull request adds). Links between docs pages are checked by the docs build.

# Only web links; relative and root-relative links are the build's job.
scheme = ["https", "http"]
# Many publishers answer link checkers with 403, 406 or 429 although the
# page exists.
accept = ["100..=103", "200..=299", "403", "406", "429"]
exclude = [
  # Placeholder in the documentation writing guide
  'youtube\.com/embed/VIDEO_ID',
]
max_concurrency = 16
timeout = 20
max_retries = 2
no_progress = true
