# PRODUCTION NGINX CONFIGURATION #
gzip on;
gzip_disable "msie6";
gzip_types text/plain text/markdown text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;

  index index.html index.htm;

  location ~ ^/(css|js)/ {
    # These assets include a digest in the filename, so they will never change
    expires max;
  }

  location ~* ^.+\.(html|htm)$ {
    # Very short caching time to ensure changes are immediately recognized
    expires 5m;
  }

  location ~* ^.+\.md$ {
    # Markdown source of each doc page, written by src/plugins/markdown-source.js
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    expires 5m;
  }

  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

}
