# =============================================================================
# GOAT Docker Compose
# =============================================================================
# Profiles:
#   - (none): Infrastructure only (db, minio, redis, windmill-server,
#             windmill-worker-default)
#   - dev: + devcontainer, tools worker with local goatlib mount, print worker
#   - workers: + tools, workflows and print workers from the released images
#
# Usage:
#   docker compose up                    # Infrastructure only
#   docker compose --profile dev up      # + dev environment
#
# To run GOAT itself (a deployment rather than local development), use the
# bundle in deploy/compose/.
# =============================================================================

x-env-base: &env-base
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  S3_PROVIDER: ${S3_PROVIDER}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_REGION: ${S3_REGION}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}


x-env-windmill: &env-windmill
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:5432/windmill?sslmode=disable
  DISABLE_NSJAIL: "true"

x-env-print: &env-print
  MODE: worker
  WORKER_GROUP: print
  WORKER_TAGS: print
  JOB_DEFAULT_TIMEOUT: 300
  PYTHONDONTWRITEBYTECODE: "1"
  WHITELIST_ENVS: "POSTGRES_SERVER,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,DUCKLAKE_DATA_DIR,DUCKLAKE_CATALOG_SCHEMA,S3_PROVIDER,S3_FORCE_PATH_STYLE,S3_ENDPOINT_URL,S3_PUBLIC_ENDPOINT_URL,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_BUCKET_NAME,S3_REGION,PRINT_BASE_URL,KEYCLOAK_SERVER_URL,REALM_NAME,KEYCLOAK_CLIENT_ID,KEYCLOAK_CLIENT_SECRET,ATLAS_BATCH_SIZE"
  ATLAS_BATCH_SIZE: ${ATLAS_BATCH_SIZE:-2}
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: goat
  DUCKLAKE_DATA_DIR: /app/data/ducklake
  DUCKLAKE_CATALOG_SCHEMA: ducklake
  S3_PROVIDER: ${S3_PROVIDER:-hetzner}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL}}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_REGION: ${S3_REGION:-us-east-1}
  KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-https://auth.dev.plan4better.de}
  REALM_NAME: ${REALM_NAME:-p4b}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-goat}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

x-env-tools: &env-tools
  <<: *env-windmill
  MODE: worker
  WORKER_GROUP: tools
  WORKER_TAGS: tools
  JOB_DEFAULT_TIMEOUT: 600
  PYTHONDONTWRITEBYTECODE: "1"
  WHITELIST_ENVS: "MAX_UPLOAD_DATASET_FILE_SIZE,POSTGRES_SERVER,POSTGRES_PORT,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_DATABASE_URI,DUCKLAKE_DATA_DIR,DUCKLAKE_CATALOG_SCHEMA,TILES_DATA_DIR,DATA_DIR,S3_PROVIDER,S3_FORCE_PATH_STYLE,S3_ENDPOINT_URL,S3_PUBLIC_ENDPOINT_URL,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_BUCKET_NAME,S3_REGION,CATALOG_S3_BUCKET,CATALOG_S3_ENDPOINT_URL,CATALOG_S3_ACCESS_KEY_ID,CATALOG_S3_SECRET_ACCESS_KEY,CATALOG_S3_REGION,OD_MATRIX_BASE_PATH,STREET_NETWORK_EDGES_BASE_PATH,STREET_NETWORK_NODES_BASE_PATH,PT_NETWORK_BASE_PATH,GTFS_DATA_PATH,GEOCODING_URL,GEOCODING_AUTHORIZATION"
  # Catalog bucket (read-only): the materialize job copies data assets from it.
  CATALOG_S3_BUCKET: ${CATALOG_S3_BUCKET:-}
  CATALOG_S3_ENDPOINT_URL: ${CATALOG_S3_ENDPOINT_URL:-}
  CATALOG_S3_ACCESS_KEY_ID: ${CATALOG_S3_ACCESS_KEY_ID:-}
  CATALOG_S3_SECRET_ACCESS_KEY: ${CATALOG_S3_SECRET_ACCESS_KEY:-}
  CATALOG_S3_REGION: ${CATALOG_S3_REGION:-}
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:5432/${POSTGRES_DB}
  DUCKLAKE_DATA_DIR: /app/data/ducklake
  DUCKLAKE_CATALOG_SCHEMA: ducklake
  TILES_DATA_DIR: /app/data/tiles
  S3_PROVIDER: ${S3_PROVIDER:-hetzner}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL}}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_REGION: ${S3_REGION:-us-east-1}
  OD_MATRIX_BASE_PATH: /app/data/traveltime_matrices
  STREET_NETWORK_EDGES_BASE_PATH: ${STREET_NETWORK_EDGES_BASE_PATH:-/app/data/street_network/edges}
  STREET_NETWORK_NODES_BASE_PATH: ${STREET_NETWORK_NODES_BASE_PATH:-/app/data/street_network/nodes}
  PT_NETWORK_BASE_PATH: ${PT_NETWORK_BASE_PATH:-/app/data/pt_network/latest_de.bin}
  GTFS_DATA_PATH: /app/data/gtfs
  GEOCODING_URL: ${GEOCODING_URL}
  GEOCODING_AUTHORIZATION: ${GEOCODING_AUTHORIZATION}

x-env-workflows: &env-workflows
  <<: *env-windmill
  MODE: worker
